<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-book">
    <header class="menu-bar">
      <button
        class="hamburger"
        type="button"
        data-menu-toggle
        aria-expanded="false"
        aria-controls="site-menu"
        aria-label="Otvori meni"
      >
        <span></span><span></span><span></span>
      </button>
    </header>

    <div class="menu-backdrop" data-menu-backdrop hidden></div>
    <nav class="menu-panel" id="site-menu" data-menu-panel hidden>
      <a class="menu-link" href="/" data-menu-close>Početna</a>
      <a class="menu-link is-active" href="/book.html?direct=1" data-menu-close>Zakaži termin</a>
      <a class="menu-link" href="/gallery.html" data-menu-close>Galerija</a>
      <a class="menu-link" href="/video.html" data-menu-close>Video</a>
      <div class="menu-contact">
        <button
          class="menu-link menu-contact-toggle"
          type="button"
          data-menu-contact-toggle
          aria-expanded="false"
          aria-controls="menu-contact-items"
        >
          Kontakt
        </button>
        <div class="menu-contact-items" id="menu-contact-items" data-menu-contact-items hidden>
          <p class="menu-hours-label">Radno vrijeme</p>
          <p class="menu-hours">10:00 – 18:00</p>
          <a class="menu-contact-link" href="https://maps.app.goo.gl/HxoPexKf5AHyDjCn7?g_st=av" target="_blank" rel="noopener noreferrer" data-menu-close>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>Maksima Gorkog 17a, Banja Luka 78000</span>
          </a>
          <a class="menu-contact-link" href="tel:+38765798135" data-menu-close>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.68 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.25a2 2 0 0 1 2.11-.45c.74.32 1.53.55 2.34.68A2 2 0 0 1 22 16.92z"/></svg>
            <span>+387 65 798 135</span>
          </a>
          <a class="menu-contact-link" href="mailto:raso_mikic@hotmail.com" data-menu-close>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg>
            <span>raso_mikic@hotmail.com</span>
          </a>
          <a class="menu-contact-link" href="https://www.instagram.com/raso_mikic/" target="_blank" rel="noopener noreferrer" data-menu-close>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            <span>Instagram</span>
          </a>
        </div>
      </div>
    </nav>

    <div class="booking-overlay is-introing" data-booking-overlay>
      <div
        class="booking-panel"
        role="main"
        aria-labelledby="booking-title"
        data-booking-panel
      >
        <a class="booking-close" href="/" aria-label="Nazad na početnu">×</a>

        <h1 id="booking-title" class="booking-title">Zakaži termin</h1>

        <form class="booking-form" data-booking-form novalidate>
          <div class="calendar" data-calendar>
            <div class="calendar-head">
              <button type="button" class="cal-nav" data-cal-prev aria-label="Prethodni mjesec">‹</button>
              <p class="calendar-label" data-cal-label></p>
              <button type="button" class="cal-nav" data-cal-next aria-label="Sljedeći mjesec">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>Pon</span><span>Uto</span><span>Sri</span><span>Čet</span><span>Pet</span><span>Sub</span><span>Ned</span>
            </div>
            <div class="calendar-grid" data-cal-grid></div>
            <input type="hidden" name="date" data-date-input required />
          </div>

          <fieldset class="time-field">
            <legend>Vrijeme</legend>
            <div class="time-grid" data-time-grid></div>
            <input type="hidden" name="time" data-time-input required />
          </fieldset>

          <label class="field">
            <span>Ime</span>
            <input type="text" name="firstName" autocomplete="given-name" required />
          </label>

          <label class="field">
            <span>Prezime</span>
            <input type="text" name="lastName" autocomplete="family-name" required />
          </label>

          <label class="field">
            <span>Broj telefona</span>
            <input
              type="tel"
              name="phone"
              autocomplete="tel"
              inputmode="tel"
              placeholder="+387 ..."
              required
            />
          </label>

          <p class="booking-error" data-booking-error hidden></p>
          <p class="booking-success" data-booking-success hidden></p>

          <button class="submit-btn" type="submit" data-submit-booking>Pošalji zahtjev</button>
        </form>
      </div>

      <div class="ink-intro" data-ink-intro aria-hidden="true">
        <div class="ink-pane ink-pane--a" data-ink-pane-a>
          <div class="ink-pane-face"></div>
        </div>
        <div class="ink-pane ink-pane--b" data-ink-pane-b>
          <div class="ink-pane-face"></div>
        </div>

        <div class="ink-stage" data-ink-stage>
          <div class="ink-flash" data-ink-flash aria-hidden="true"></div>

          <div class="ink-write" data-ink-write>
            <div class="ink-line" data-ink-line>
              <p class="ink-script">
                <span data-ink-text></span><span class="ink-caret" data-ink-caret></span>
              </p>
              <div class="ink-machine" data-ink-machine aria-hidden="true">
                <div class="ink-machine-buzz">
                  <svg viewBox="0 0 48 72" width="34" height="52" fill="none">
                    <rect x="15" y="4" width="18" height="28" rx="2.5" stroke="currentColor" stroke-width="2" />
                    <rect x="18" y="9" width="12" height="7" rx="1" stroke="currentColor" stroke-width="1.4" />
                    <path d="M24 32 V58" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                    <path d="M20 58 H28" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <circle class="ink-needle-tip" cx="24" cy="62" r="2.2" fill="currentColor" />
                    <path d="M11 16 H15 M33 16 H37 M11 23 H15 M33 23 H37" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <svg class="ink-crack" data-ink-crack viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="ink-crack-bolt ink-crack-bolt--1" data-crack-1 fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" />
            <path class="ink-crack-bolt ink-crack-bolt--2" data-crack-2 fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round" />
            <path class="ink-crack-bolt ink-crack-bolt--3" data-crack-3 fill="none" stroke="currentColor" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" />
            <path class="ink-crack-bolt ink-crack-bolt--4" data-crack-4 fill="none" stroke="currentColor" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round" />
            <path class="ink-crack-bolt ink-crack-bolt--5" data-crack-5 fill="none" stroke="currentColor" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>

    <script src="menu.js?v=2"></script>
    <script src="script.js?v=book6"></script>
  </body>
</html>
